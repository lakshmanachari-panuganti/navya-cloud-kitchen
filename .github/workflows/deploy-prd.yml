name: Deploy · PRD

# Production deploy: main branch → prd SWA. Same single-SWA model as dev
# (see deploy-dev.yml). No PR previews for prd — those live on dev.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'config.js'
      - 'images/**'
      - 'api/**'
      - '.github/workflows/deploy-prd.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prd
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy - Prd
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PRD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          api_location: 'api'
          output_location: ''
          skip_app_build: true
          production_branch: main
