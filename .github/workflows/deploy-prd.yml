name: Deploy · PRD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy-prd.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prd
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy (PRD)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Lint Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Deploy to Azure Static Web Apps (PRD)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PRD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: 'frontend'
          api_location: 'backend'
          output_location: ''
          skip_app_build: true
